<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>VHEOA — Better Choices for Study, Work & Everyday Life</title>
  <meta name="description" content="VHEOA helps students, professionals and organizations make better decisions through practical research, product comparisons and value-focused analysis." />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#ffdb10" />

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>V</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --yellow: #ffdb10;
      --yellow-dark: #e6c200;
      --yellow-darker: #8f7900;
      --yellow-light: #fff8e1;
      --bg: #fdfdfc;
      --surface: #ffffff;
      --text: #1a1a2e;
      --muted: #5a5a72;
      --border: #eaeaea;
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
      --radius: 16px;
      --max-width: 1200px;
      --nav-height: 68px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    a { color: inherit; text-decoration: none; }

    img { width: 100%; display: block; object-fit: cover; }

    button, input { font: inherit; }

    .container {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 24px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255,255,255,.94);
      backdrop-filter: blur(12px);
      border-bottom: 2px solid var(--yellow);
      height: var(--nav-height);
      display: flex;
      align-items: center;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--yellow-darker);
      letter-spacing: -.02em;
    }

    .logo span { color: var(--text); }

    .nav-links {
      display: flex;
      gap: 28px;
      font-weight: 600;
      font-size: .95rem;
    }

    .nav-links a {
      padding: 4px 0;
      border-bottom: 3px solid transparent;
      transition: .2s;
    }

    .nav-links a:hover,
    .nav-links a.active {
      border-bottom-color: var(--yellow);
      color: var(--yellow-darker);
    }

    .menu-toggle {
      display: none;
      font-size: 1.6rem;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 8px;
    }

    #main-content {
      min-height: 60vh;
      padding: 40px 0 60px;
    }

    .hero {
      text-align: center;
      padding: 20px 0 30px;
    }

    .hero h1 {
      font-size: clamp(2.5rem, 6vw, 4.2rem);
      font-weight: 800;
      letter-spacing: -.03em;
      line-height: 1.1;
      margin-bottom: 12px;
    }

    .hero h1 span {
      color: var(--yellow-darker);
      background: var(--yellow-light);
      padding: 0 12px;
      border-radius: 12px;
      display: inline-block;
    }

    .hero p {
      font-size: 1.15rem;
      color: var(--muted);
      max-width: 700px;
      margin: 0 auto 24px;
    }

    .search-wrapper {
      max-width: 560px;
      margin: 0 auto 20px;
    }

    .search-wrapper input {
      width: 100%;
      padding: 14px 20px;
      border: 2px solid var(--border);
      border-radius: 50px;
      font-size: 1rem;
      background: white;
      transition: .2s;
    }

    .search-wrapper input:focus {
      outline: none;
      border-color: var(--yellow-dark);
      box-shadow: 0 0 0 4px rgba(255,219,16,.2);
    }

    .section-title {
      font-size: 1.8rem;
      font-weight: 700;
      margin: 40px 0 20px;
      color: var(--text);
    }

    .section-title small {
      font-weight: 400;
      color: var(--muted);
      font-size: 1rem;
      margin-left: 12px;
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 30px;
    }

    .category-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 16px;
      text-align: center;
      transition: .2s ease;
      cursor: pointer;
      box-shadow: var(--shadow);
    }

    .category-card:hover {
      border-color: var(--yellow);
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(255,219,16,.15);
    }

    .category-card .icon {
      font-size: 2.2rem;
      display: block;
      margin-bottom: 8px;
    }

    .category-card .name {
      font-weight: 700;
      font-size: .95rem;
    }

    .category-card .count {
      font-size: .8rem;
      color: var(--muted);
      margin-top: 3px;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 24px;
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      transition: .25s ease;
      box-shadow: var(--shadow);
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 40px rgba(0,0,0,.08);
    }

    .card-image {
      height: 180px;
      overflow: hidden;
      background: #f0f0f0;
    }

    .card-image img {
      height: 100%;
      transition: transform .5s ease;
    }

    .card:hover .card-image img { transform: scale(1.04); }

    .card-body { padding: 18px 20px 22px; }

    .card-body .tag,
    .article-header .meta .tag {
      display: inline-block;
      font-size: .7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--yellow-darker);
      background: var(--yellow-light);
      padding: 2px 12px;
      border-radius: 20px;
    }

    .card-body .tag { margin-bottom: 8px; }

    .card-body h3 {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .card-body p {
      color: var(--muted);
      font-size: .92rem;
      margin-bottom: 14px;
    }

    .card-body .view-more {
      display: inline-block;
      font-weight: 700;
      color: var(--yellow-darker);
      border-bottom: 2px solid var(--yellow);
    }

    .article-page {
      max-width: 900px;
      margin: 0 auto;
    }

    .article-header {
      margin-bottom: 30px;
    }

    .article-header h1 {
      font-size: clamp(2.2rem, 5vw, 3.4rem);
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .article-header .meta {
      color: var(--muted);
      font-size: .9rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }

    .article-header .meta .view-count {
      font-size: .8rem;
      color: var(--muted);
    }

    .article-header .meta .view-count::before { content: "👁️ "; }

    .action-buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 14px 0 0;
    }

    .action-buttons .btn-save,
    .action-buttons .btn-follow {
      display: inline-block;
      padding: 8px 18px;
      border-radius: 30px;
      font-weight: 700;
      text-decoration: none;
      transition: .2s;
      font-size: .9rem;
    }

    .action-buttons .btn-save {
      background: var(--yellow);
      color: var(--text);
      border: 2px solid var(--yellow);
    }

    .action-buttons .btn-save:hover {
      background: var(--yellow-dark);
      border-color: var(--yellow-dark);
    }

    .action-buttons .btn-follow {
      background: transparent;
      color: var(--yellow-darker);
      border: 2px solid var(--yellow);
    }

    .action-buttons .btn-follow:hover { background: var(--yellow-light); }

    .article-content {
      font-size: 1.08rem;
      line-height: 1.8;
      color: var(--text);
    }

    .article-content h2 {
      font-size: 1.8rem;
      font-weight: 700;
      margin-top: 40px;
      margin-bottom: 12px;
    }

    .article-content h3 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-top: 30px;
      margin-bottom: 10px;
    }

    .article-content p { margin-bottom: 18px; }

    .article-content img {
      border-radius: 12px;
      margin: 20px 0;
      border: 1px solid var(--border);
    }

    .article-content ul,
    .article-content ol {
      margin: 16px 0 20px 24px;
    }

    .article-content li { margin-bottom: 8px; }

    .article-content blockquote {
      margin: 24px 0;
      padding: 16px 20px;
      border-left: 4px solid var(--yellow);
      background: var(--yellow-light);
      border-radius: 0 10px 10px 0;
    }

    .article-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 24px 0 28px;
      font-size: .95rem;
      background: white;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .article-content th,
    .article-content td {
      padding: 11px 12px;
      border: 1px solid var(--border);
      text-align: left;
      vertical-align: top;
    }

    .article-content th {
      background: var(--yellow-light);
      font-weight: 700;
    }

    .article-content a:not(.btn):not(.dynamic-link) {
      color: var(--yellow-darker);
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .article-content a:not(.btn):not(.dynamic-link):hover {
      color: var(--yellow-dark);
    }

    .article-content .dynamic-link {
      color: var(--yellow-darker);
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .article-content .dynamic-link.disabled {
      opacity: .5;
      cursor: not-allowed;
      pointer-events: none;
    }

    .back-home {
      display: inline-block;
      margin-top: 30px;
      padding: 10px 24px;
      background: var(--yellow);
      color: var(--text);
      font-weight: 700;
      border-radius: 30px;
      transition: .2s;
    }

    .back-home:hover { background: var(--yellow-dark); }

    .page-content {
      max-width: 720px;
      margin: 0 auto;
    }

    .page-content h2 {
      font-size: 2.4rem;
      font-weight: 800;
      margin-bottom: 16px;
    }

    .page-content p {
      font-size: 1.1rem;
      color: var(--muted);
      margin-bottom: 16px;
    }

    footer {
      background: #0d1c26;
      color: #b0c4d0;
      padding: 48px 0 28px;
      margin-top: 20px;
    }

    .footer-inner {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 30px;
    }

    .footer-brand .logo { color: var(--yellow); }
    .footer-brand .logo span { color: white; }

    .footer-brand p {
      max-width: 380px;
      margin-top: 8px;
      font-size: .9rem;
    }

    .footer-links {
      display: flex;
      gap: 48px;
      flex-wrap: wrap;
    }

    .footer-links h4 {
      color: white;
      margin-bottom: 8px;
    }

    .footer-links ul { list-style: none; }

    .footer-links li {
      margin: 4px 0;
      font-size: .9rem;
    }

    .footer-links a:hover { color: white; }

    .copyright {
      border-top: 1px solid rgba(255,255,255,.06);
      margin-top: 32px;
      padding-top: 20px;
      font-size: .8rem;
      text-align: center;
    }

    .breadcrumb {
      font-size: .9rem;
      color: var(--muted);
      margin-bottom: 20px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .breadcrumb a {
      color: var(--yellow-darker);
      font-weight: 600;
    }

    .breadcrumb a:hover { text-decoration: underline; }

    .empty-state {
      padding: 35px 20px;
      text-align: center;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .loading-spinner {
      text-align: center;
      padding: 48px;
      color: var(--muted);
      font-size: 1.1rem;
    }

    .hidden { display: none !important; }

    @media (max-width: 700px) {
      .menu-toggle { display: block; }

      .nav-links {
        display: none;
        flex-direction: column;
        position: absolute;
        top: var(--nav-height);
        left: 0;
        right: 0;
        background: white;
        padding: 24px;
        border-bottom: 2px solid var(--yellow);
        gap: 16px;
        box-shadow: 0 12px 30px rgba(0,0,0,.06);
      }

      .nav-links.open { display: flex; }

      .card-grid { grid-template-columns: 1fr 1fr; }
      .category-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
      .footer-inner { flex-direction: column; }
      .article-content { font-size: 1rem; }

      .article-content table {
        display: block;
        overflow-x: auto;
        white-space: nowrap;
      }
    }

    @media (max-width: 480px) {
      .card-grid { grid-template-columns: 1fr; }
      .hero h1 { font-size: 2rem; }
      .category-grid { grid-template-columns: repeat(2, 1fr); }
      .container { padding: 0 16px; }
    }
  </style>
</head>

<body>

<header>
  <div class="container nav">
    <a href="#" class="logo" onclick="navigateTo('home'); return false;">VHE<span>OA</span></a>

    <nav class="nav-links" id="navLinks">
      <a href="#" class="active" data-page="home" onclick="navigateTo('home'); return false;">Home</a>
      <a href="#" data-page="about" onclick="navigateTo('about'); return false;">About</a>
      <a href="#" data-page="contact" onclick="navigateTo('contact'); return false;">Contact</a>
    </nav>

    <button class="menu-toggle" onclick="toggleMobileMenu()" aria-label="Toggle menu">☰</button>
  </div>
</header>

<main id="main-content"></main>

<footer>
  <div class="container">
    <div class="footer-inner">
      <div class="footer-brand">
        <div class="logo">VHE<span>OA</span></div>
        <p>Better choices for study, work and everyday life — through practical research, comparisons and value-focused analysis.</p>
      </div>

      <div class="footer-links">
        <div>
          <h4>Explore</h4>
          <ul>
            <li><a href="#" onclick="navigateTo('home'); return false;">Home</a></li>
            <li><a href="#" onclick="navigateTo('about'); return false;">About</a></li>
            <li><a href="#" onclick="navigateTo('contact'); return false;">Contact</a></li>
          </ul>
        </div>
      </div>
    </div>

    <div class="copyright">
      &copy; 2026 VHEOA. Research → Compare → Understand → Decide.
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  /* ============================================================
     VHEOA / SUPABASE CONFIGURATION
     ============================================================ */

  const SUPABASE_URL = 'https://lfuwtyvdvxxyyeulbuqa.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxmdXd0eXZkdnh4eXlldWxidXFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4NjgwNDgsImV4cCI6MjEwMjQ0NDA0OH0.pVhMixa3JkRh2j1a8vm5x7w1R3GTgkhh43CHq2YYpgo';

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  /* ============================================================
     VHEOA CONTENT CATEGORIES
     ============================================================ */

  const categories = [
    { id: 'student-life', name: 'Student Life', icon: '🎓', tag: 'student-life' },
    { id: 'office-productivity', name: 'Office & Productivity', icon: '💼', tag: 'office-productivity' },
    { id: 'stationery-supplies', name: 'Stationery & Supplies', icon: '🖊️', tag: 'stationery-supplies' },
    { id: 'technology', name: 'Technology', icon: '💻', tag: 'technology' },
    { id: 'personal-use', name: 'Personal Use', icon: '🏠', tag: 'personal-use' },
    { id: 'money-saving', name: 'Money-Saving Choices', icon: '💰', tag: 'money-saving' },
    { id: 'procurement', name: 'Purchasing & Procurement', icon: '🏢', tag: 'procurement' },
    { id: 'learning', name: 'Learning & Education', icon: '📚', tag: 'learning' },
    { id: 'wellness', name: 'Wellness & Work-Life', icon: '🧘', tag: 'wellness' },
    { id: 'product-comparisons', name: 'Product Comparisons', icon: '🔎', tag: 'product-comparisons' }
  ];

  /* ============================================================
     SAFE HTML HELPERS
     ============================================================ */

  function escapeHTML(value) {
    return String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
  }

  function escapeAttribute(value) {
    return escapeHTML(value);
  }

  /* ============================================================
     SPA PAGE TEMPLATES
     ============================================================ */

  const pages = {
    home: `
      <div class="container">
        <div class="hero">
          <h1>Better choices for <span>everyday life.</span></h1>
          <p>Practical research, product comparisons and money-saving ideas for students, professionals and organizations.</p>
          <div class="search-wrapper">
            <input type="search" id="searchInput" placeholder="Search articles…" aria-label="Search articles" autocomplete="off" />
          </div>
        </div>

        <h2 class="section-title">Explore by Category <small>research for study, work & everyday life</small></h2>
        <div class="category-grid">
          ${categories.map(cat => `
            <div class="category-card" data-category-id="${escapeAttribute(cat.id)}" onclick="navigateToCategory('${escapeAttribute(cat.id)}')" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' ') navigateToCategory('${escapeAttribute(cat.id)}')">
              <span class="icon">${cat.icon}</span>
              <div class="name">${escapeHTML(cat.name)}</div>
              <div class="count" id="count-${escapeAttribute(cat.id)}">Loading…</div>
            </div>
          `).join('')}
        </div>

        <h2 class="section-title">Featured Articles <small>editorial picks</small></h2>
        <div class="card-grid" id="featuredGrid">
          <div class="loading-spinner">Loading featured articles…</div>
        </div>

        <h2 class="section-title">Latest Articles <small>newly published</small></h2>
        <div class="card-grid" id="latestGrid">
          <div class="loading-spinner">Loading latest articles…</div>
        </div>
      </div>
    `,

    category: `
      <div class="container">
        <div class="breadcrumb">
          <a href="#" onclick="navigateTo('home'); return false;">← Home</a> / <span id="categoryName">Category</span>
        </div>
        <h2 class="section-title" id="categoryTitle">Category</h2>
        <p style="color: var(--muted); margin-bottom: 20px;" id="categoryDescription">Explore articles in this category.</p>
        <div class="card-grid" id="categoryGrid">
          <div class="loading-spinner">Loading articles…</div>
        </div>
        <a href="#" class="back-home" onclick="navigateTo('home'); return false;">← Back to Home</a>
      </div>
    `,

    article: `
      <div class="container article-page">
        <div class="breadcrumb">
          <a href="#" onclick="navigateTo('home'); return false;">← Home</a> / <span id="articleCategory">Category</span> / <span id="articleBreadcrumbTitle">Article</span>
        </div>
        <div id="articleContent">
          <div class="loading-spinner">Loading article…</div>
        </div>
        <a href="#" class="back-home" onclick="navigateTo('home'); return false;">← Back to Home</a>
      </div>
    `,

    about: `
      <div class="container page-content">
        <h2>About VHEOA</h2>
        <p>VHEOA helps students, professionals and organizations make better decisions through practical research, product comparisons and value-focused analysis.</p>
        <p>We look at the real-world trade-offs behind everyday purchasing decisions — including quality, usefulness, price, durability and total value.</p>
        <p>Our goal is simple: <strong>Research → Compare → Understand → Decide.</strong></p>
      </div>
    `,

    contact: `
      <div class="container page-content">
        <h2>Contact VHEOA</h2>
        <p>Have a product suggestion, research topic or question? We'd love to hear from you.</p>
        <p>Contact details will be published here as the VHEOA platform develops.</p>
      </div>
    `
  };

  let currentPage = 'home';
  let currentCategoryId = null;
  let currentArticleSlug = null;

  /* ============================================================
     ROUTING
     ============================================================ */

  function navigateTo(pageKey, updateHash = true) {
    if (!pages[pageKey]) return;

    currentPage = pageKey;
    currentCategoryId = null;

    if (pageKey === 'home') {
      currentArticleSlug = null;
      if (updateHash) {
        history.pushState(null, '', window.location.pathname + window.location.search);
      }
    }

    const main = document.getElementById('main-content');
    if (!main) return;

    main.innerHTML = pages[pageKey];
    updateActiveNavigation(pageKey);

    if (pageKey === 'home') {
      loadCategoryCounts();
      loadFeaturedArticles();
      loadLatestArticles();
      setupSearch();
    }

    closeMobileMenu();
  }

  function navigateToCategory(categoryId, updateHash = true) {
    const category = categories.find(c => c.id === categoryId);
    if (!category) return;

    currentCategoryId = categoryId;
    currentPage = 'category';
    currentArticleSlug = null;

    if (updateHash) {
      window.location.hash = `category-${encodeURIComponent(categoryId)}`;
    }

    const main = document.getElementById('main-content');
    if (!main) return;

    main.innerHTML = pages.category;
    document.getElementById('categoryName').textContent = category.name;
    document.getElementById('categoryTitle').textContent = `${category.icon} ${category.name}`;
    document.getElementById('categoryDescription').textContent = `Articles tagged with "${category.name}".`;

    updateActiveNavigation('home');
    loadCategoryArticles(category.tag);
    closeMobileMenu();
  }

  function navigateToArticle(slug, updateHash = true) {
    if (!slug) return;

    currentPage = 'article';
    currentCategoryId = null;
    currentArticleSlug = slug;

    if (updateHash) {
      window.location.hash = `article-${encodeURIComponent(slug)}`;
    }

    const main = document.getElementById('main-content');
    if (!main) return;

    main.innerHTML = pages.article;
    updateActiveNavigation('home');
    closeMobileMenu();
    loadArticle(slug);
  }

  function updateActiveNavigation(pageKey) {
    document.querySelectorAll('.nav-links a').forEach(link => {
      link.classList.toggle('active', link.dataset.page === pageKey);
    });
  }

  function toggleMobileMenu() {
    document.getElementById('navLinks')?.classList.toggle('open');
  }

  function closeMobileMenu() {
    document.getElementById('navLinks')?.classList.remove('open');
  }

  /* ============================================================
     HASH ROUTING
     ============================================================ */

  function handleHashChange() {
    const rawHash = window.location.hash.replace(/^#/, '');

    if (rawHash.startsWith('article-')) {
      const slug = decodeURIComponent(rawHash.substring('article-'.length));
      if (currentPage !== 'article' || currentArticleSlug !== slug) {
        navigateToArticle(slug, false);
      }
      return;
    }

    if (rawHash.startsWith('category-')) {
      const categoryId = decodeURIComponent(rawHash.substring('category-'.length));
      if (currentPage !== 'category' || currentCategoryId !== categoryId) {
        navigateToCategory(categoryId, false);
      }
      return;
    }

    if (currentPage !== 'home') {
      navigateTo('home', false);
    }
  }

  window.addEventListener('hashchange', handleHashChange);

  /* ============================================================
     IP GEOLOCATION (for affiliate links)
     ============================================================ */

  const COUNTRY_CACHE_MS = 60 * 60 * 1000;

  async function getCountryCode() {
    try {
      const cached = localStorage.getItem('userCountry');
      const cachedTime = localStorage.getItem('userCountryTimestamp');
      if (cached && cachedTime) {
        const age = Date.now() - parseInt(cachedTime, 10);
        if (age < COUNTRY_CACHE_MS) return cached;
      }
    } catch (_) {}

    const apis = [
      { url: 'https://ipapi.co/json/', key: 'country_code' },
      { url: 'https://ipinfo.io/json', key: 'country' },
      { url: 'https://api.country.is/', key: 'country' }
    ];

    for (const api of apis) {
      try {
        const res = await fetch(api.url, { method: 'GET', headers: { 'Accept': 'application/json' }, cache: 'no-store' });
        if (!res.ok) continue;
        const data = await res.json();
        const rawCountry = data?.[api.key];
        if (rawCountry && typeof rawCountry === 'string' && rawCountry.trim().length === 2) {
          const iso = rawCountry.trim().toUpperCase();
          try {
            localStorage.setItem('userCountry', iso);
            localStorage.setItem('userCountryTimestamp', String(Date.now()));
          } catch (_) {}
          return iso;
        }
      } catch (_) { continue; }
    }

    return 'default';
  }

  function getVisitorId() {
    try {
      let visitorId = localStorage.getItem('visitorId');
      if (!visitorId) {
        visitorId = window.crypto?.randomUUID ? window.crypto.randomUUID() : 'visitor-' + Date.now() + '-' + Math.random().toString(36).substring(2, 11);
        localStorage.setItem('visitorId', visitorId);
      }
      return visitorId;
    } catch (_) {
      return 'visitor-' + Date.now() + '-' + Math.random().toString(36).substring(2, 11);
    }
  }

  /* ============================================================
     ARTICLE CARD RENDERING
     ============================================================ */

  function createCardHTML(article) {
    const title = escapeHTML(article.title || 'Untitled Article');
    const description = escapeHTML(article.description || 'Read the full VHEOA analysis.');
    const tag = escapeHTML(article.tag || 'VHEOA');
    const slug = String(article.slug || '');
    const imageUrl = article.image_url ? escapeAttribute(article.image_url) : '';

    const imageHTML = imageUrl ? `<img src="${imageUrl}" alt="${title}" loading="lazy" onerror="this.parentElement.classList.add('image-error'); this.style.display='none';" />` : `<div style="height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted);">VHEOA</div>`;

    return `
      <article class="card" data-title="${escapeAttribute((article.title || '').toLowerCase())}" data-tag="${escapeAttribute((article.tag || '').toLowerCase())}" onclick="navigateToArticle('${escapeAttribute(slug)}')" role="link" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' ') navigateToArticle('${escapeAttribute(slug)}')">
        <div class="card-image">${imageHTML}</div>
        <div class="card-body">
          <span class="tag">${tag}</span>
          <h3>${title}</h3>
          <p>${description}</p>
          <span class="view-more">Read Article →</span>
        </div>
      </article>
    `;
  }

  /* ============================================================
     LOAD CATEGORY COUNTS
     ============================================================ */

  async function loadCategoryCounts() {
    try {
      const { data, error } = await supabaseClient.from('articles').select('tag');
      if (error) return;
      const counts = {};
      (data || []).forEach(a => { if (a.tag) counts[a.tag] = (counts[a.tag] || 0) + 1; });
      categories.forEach(cat => {
        const el = document.getElementById(`count-${cat.id}`);
        if (el) {
          const count = counts[cat.tag] || 0;
          el.textContent = `${count} article${count === 1 ? '' : 's'}`;
        }
      });
    } catch (_) {}
  }

  /* ============================================================
     LOAD ARTICLES (Featured, Latest, Category)
     ============================================================ */

  async function loadFeaturedArticles() {
    const grid = document.getElementById('featuredGrid');
    if (!grid) return;
    grid.innerHTML = '<div class="loading-spinner">Loading featured articles…</div>';

    try {
      const { data: articles, error } = await supabaseClient.from('articles').select('*').eq('featured', true).order('created_at', { ascending: false }).limit(4);
      if (error || !articles || articles.length === 0) {
        grid.innerHTML = `<div class="empty-state">No featured articles yet.</div>`;
        return;
      }
      grid.innerHTML = articles.map(createCardHTML).join('');
    } catch (_) {
      grid.innerHTML = `<div class="empty-state">Featured articles could not be loaded.</div>`;
    }
  }

  async function loadLatestArticles() {
    const grid = document.getElementById('latestGrid');
    if (!grid) return;
    grid.innerHTML = '<div class="loading-spinner">Loading latest articles…</div>';

    try {
      const { data: articles, error } = await supabaseClient.from('articles').select('*').order('created_at', { ascending: false }).limit(6);
      if (error || !articles || articles.length === 0) {
        grid.innerHTML = `<div class="empty-state">No articles published yet.</div>`;
        return;
      }
      grid.innerHTML = articles.map(createCardHTML).join('');
    } catch (_) {
      grid.innerHTML = `<div class="empty-state">Latest articles could not be loaded.</div>`;
    }
  }

  async function loadCategoryArticles(tag) {
    const grid = document.getElementById('categoryGrid');
    if (!grid) return;
    grid.innerHTML = '<div class="loading-spinner">Loading articles…</div>';

    try {
      const { data: articles, error } = await supabaseClient.from('articles').select('*').eq('tag', tag).order('created_at', { ascending: false });
      if (error || !articles || articles.length === 0) {
        grid.innerHTML = `<div class="empty-state">No articles in this category yet.</div>`;
        return;
      }
      grid.innerHTML = articles.map(createCardHTML).join('');
    } catch (_) {
      grid.innerHTML = `<div class="empty-state">Articles could not be loaded.</div>`;
    }
  }

  /* ============================================================
     LOAD SINGLE ARTICLE
     ============================================================ */

  async function loadArticle(slug) {
    const container = document.getElementById('articleContent');
    const categorySpan = document.getElementById('articleCategory');
    const breadcrumbTitle = document.getElementById('articleBreadcrumbTitle');

    if (!container) return;
    container.innerHTML = '<div class="loading-spinner">Loading article…</div>';

    try {
      const { data: article, error } = await supabaseClient.from('articles').select('*').eq('slug', slug).single();
      if (error || !article) {
        container.innerHTML = `<div class="empty-state">Article not found.</div>`;
        return;
      }

      // Update metadata
      document.title = `${article.title} — VHEOA`;
      if (categorySpan) {
        const category = categories.find(c => c.tag === article.tag);
        categorySpan.textContent = category ? category.name : (article.tag || 'VHEOA');
      }
      if (breadcrumbTitle) breadcrumbTitle.textContent = article.title || 'Article';

      // Increment view count
      let displayViews = Number(article.views || 0);
      try {
        const { error: viewError } = await supabaseClient.from('articles').update({ views: displayViews + 1 }).eq('id', article.id);
        if (!viewError) displayViews += 1;
      } catch (_) {}

      // Build article HTML
      container.innerHTML = `
        <div class="article-header">
          <h1>${escapeHTML(article.title)}</h1>
          <div class="meta">
            <span class="tag">${escapeHTML(article.tag || 'VHEOA')}</span>
            ${article.featured ? '<span>⭐ Featured</span>' : ''}
            <span class="view-count">${displayViews} views</span>
          </div>
          <div class="action-buttons">
            <a href="https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(window.location.href)}" target="_blank" rel="noopener noreferrer" class="btn-save">↗ Repost on LinkedIn</a>
            <a href="#" class="btn-follow" onclick="event.preventDefault(); alert('Follow VHEOA on LinkedIn – link to be added.');">Follow VHEOA on LinkedIn →</a>
          </div>
        </div>
        <div class="article-content" data-article-id="${escapeAttribute(article.id)}">
          ${article.content || '<p>No full content available yet.</p>'}
        </div>
      `;

      // Rewrite affiliate links
      await rewriteDynamicLinks(article.id);
    } catch (_) {
      container.innerHTML = `<div class="empty-state">The article could not be loaded.</div>`;
    }
  }

  /* ============================================================
     AFFILIATE LINK RESOLUTION & CLICK TRACKING
     ============================================================ */

  async function rewriteDynamicLinks(articleId) {
    const container = document.querySelector(`.article-content[data-article-id="${CSS.escape(String(articleId))}"]`);
    if (!container) return;

    const links = container.querySelectorAll('.dynamic-link');
    if (!links.length) return;

    const country = await getCountryCode();

    try {
      const { data: affiliateLinks, error } = await supabaseClient.from('affiliate_links').select('affiliate_key, link_url, country_code').eq('article_id', articleId).in('country_code', [country, 'default']);
      if (error || !affiliateLinks) {
        links.forEach(link => { link.classList.add('disabled'); link.title = 'Affiliate link unavailable'; });
        return;
      }

      const linkMap = {};
      affiliateLinks.forEach(item => {
        const key = String(item.affiliate_key || '').trim().toLowerCase();
        if (key && item.link_url) {
          if (item.country_code === country) linkMap[key] = item.link_url;
          else if (item.country_code === 'default' && !linkMap[key]) linkMap[key] = item.link_url;
        }
      });

      links.forEach(link => {
        const key = String(link.dataset.affiliateKey || '').trim().toLowerCase();
        const url = key ? linkMap[key] : null;
        if (url) {
          link.href = url;
          link.classList.remove('disabled');
          link.title = '';
          link.removeEventListener('click', trackClickHandler);
          link.addEventListener('click', trackClickHandler);
        } else {
          link.classList.add('disabled');
          link.removeAttribute('href');
          link.title = 'No affiliate link available for your region';
        }
      });
    } catch (_) {}
  }

  async function trackClickHandler(e) {
    e.preventDefault();
    const link = e.currentTarget;
    const href = link.href;
    if (!href) return;

    const affiliateKey = link.dataset.affiliateKey || null;
    const articleContent = link.closest('.article-content');
    const articleId = articleContent?.dataset.articleId || null;
    const country = await getCountryCode();
    const visitorId = getVisitorId();

    try {
      await supabaseClient.from('click_logs').insert({
        article_id: articleId || null,
        affiliate_key: affiliateKey,
        link_url: href,
        country_code: country,
        visitor_id: visitorId,
        user_agent: navigator.userAgent
      });
    } catch (_) {}

    window.open(href, '_blank', 'noopener');
  }

  /* ============================================================
     SEARCH
     ============================================================ */

  function setupSearch() {
    const input = document.getElementById('searchInput');
    if (!input) return;
    input.addEventListener('input', filterArticles);
  }

  function filterArticles() {
    const query = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();
    const cards = document.querySelectorAll('.card');
    cards.forEach(card => {
      const title = card.dataset.title || '';
      const tag = card.dataset.tag || '';
      const match = !query || title.includes(query) || tag.includes(query);
      card.style.display = match ? '' : 'none';
    });
  }

  /* ============================================================
     INITIAL LOAD
     ============================================================ */

  document.addEventListener('DOMContentLoaded', () => {
    handleHashChange();
    if (!window.location.hash) {
      navigateTo('home', false);
    }
  });
</script>

</body>
