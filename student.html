<!-- Turnstile setup — the ready queue MUST exist before api.js loads -->
<script>
  window.__tsReadyQueue = [];
  window.__tsReady = false;
  window.VheoaTsReady = function () {
    window.__tsReady = true;
    var q = window.__tsReadyQueue;
    window.__tsReadyQueue = [];
    for (var i = 0; i < q.length; i++) {
      try { q[i](); } catch (e) { console.warn('TS ready cb failed', e); }
    }
  };
</script>
<script
  src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=VheoaTsReady&render=explicit"
  async defer></script>
</head>
<body>

<header class="site">
  <div class="container inner">
    <a href="/" class="logo">Vheoa</a>
    <nav>
      <a href="leaderboard.html">Leaderboard</a>
      <a href="about.html">About</a>
      <a href="submit.html">Submit CV</a>
    </nav>
  </div>
</header>

<main class="container" id="profile">
  <p class="loading">Loading…</p>
</main>

<!-- Turnstile security check -->
<div id="turnstile-widget" style="min-height: 70px; min-width: 300px; margin: 12px 0;"></div>

<footer class="site">
  <div class="container">© <span id="year"></span> Vheoa</div>
</footer>

<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
<script src="assets/js/config.js"></script>
<script type="module" src="assets/js/student.js"></script>

</body>
</html>
